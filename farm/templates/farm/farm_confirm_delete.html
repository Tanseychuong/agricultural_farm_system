{% extends "farm/base.html" %} {% block content %}

<h2>Delete Farm</h2>

<p>
  Are you sure you want to delete
  <strong>{{ farm.farm_name }}</strong>?
</p>

<p>Location: {{ farm.location }}</p>

<p>Total Size: {{ farm.total_size }}</p>

<form method="post">
  {% csrf_token %}

  <button type="submit">Yes, Delete</button>

  <a href="{% url 'farm_list' %}"> Cancel </a>
</form>

{% endblock %}
