{% extends "farm/base.html" %} {% block content %}

<h2>Delete Crop</h2>

<p>
  Are you sure you want to delete
  <strong>{{ crop.crop_type }} - {{ crop.plot_number }}</strong>?
</p>

<form method="post">
  {% csrf_token %}

  <button type="submit">Yes, Delete</button>

  <a href="{% url 'crop_list' %}">Cancel</a>
</form>

{% endblock %}
